name: Build BAROX VS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build and verify
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify packaged JAR
        run: |
          echo "Build output:"
          ls -lah build/libs
          test -s build/libs/BAROX-VS-v002.jar
          unzip -t build/libs/BAROX-VS-v002.jar
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v002
          path: build/libs/BAROX-VS-v002.jar
          if-no-files-found: error
      - name: Publish tagged release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v002
          target_commitish: main
          name: BAROX VS v002
          body: "BAROX VS v002 — Minecraft Java 1.21.4 Fabric. Client-side particle cosmetics."
          files: build/libs/BAROX-VS-v002.jar
          generate_release_notes: true
